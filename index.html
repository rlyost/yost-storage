<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>The Pack</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        min-height: 100svh;
        padding: 2rem;
        background: #f3f3f3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        place-items: center;
        min-height: calc(100svh - 4rem);
        padding-bottom: clamp(8rem, 24vh, 12rem);
      }

      .logo-frame {
        position: relative;
        width: min(70vw, 32rem);
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Night: the mark is a black disc, so ring it to lift it off the page.
         Percentages match the disc inside gitlabrador.webp (bbox 24,234-757,959
         of 784x1168), so the ring tracks the logo at any size. */
      [data-daylight="night"] .logo-frame::after {
        content: "";
        position: absolute;
        top: 51.1%;
        left: 49.8%;
        width: 99%;
        aspect-ratio: 1;
        border: 2px solid #fff;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .site-footer {
        position: absolute;
        top: 0;
        right: 1.5rem;
        bottom: 1rem;
        text-align: right;
      }

      .footer-nav {
        position: absolute;
        top: 50%;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.75rem;
        transform: translateY(-50%);
      }

      .footer-nav a,
      .footer-nav .nav-action {
        color: #555;
        font-size: 0.75rem;
        font-weight: 600;
        text-decoration: none;
      }

      /* Set Alarm acts on this page rather than navigating, so it is a button
         wearing the nav links' clothes. */
      .footer-nav .nav-action {
        padding: 0;
        border: 0;
        background: none;
        font-family: inherit;
        line-height: inherit;
        cursor: pointer;
      }

      .footer-nav a:hover,
      .footer-nav .nav-action:hover {
        color: #000;
        text-decoration: underline;
        text-underline-offset: 0.2rem;
      }

      /* Sits above the clock so an armed alarm is visible without opening
         the panel. Hidden entirely while idle. */
      /* One centred stack at the foot of the page. Grouping these lets the
         clock resize without four hand-tuned offsets drifting out of step. */
      .footer-stack {
        position: fixed;
        z-index: 1;
        bottom: 1rem;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        max-width: 100vw;
        padding: 0 1rem;
        color: #111;
        text-align: center;
        transform: translateX(-50%);
      }

      .alarm-status {
        /* Scales with the viewport like the clock below it, so the armed
           readout stays legible across the row instead of at a fixed 11px. */
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 600;
        letter-spacing: 0.1em;
        opacity: 0.7;
      }

      .clock {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        /* Caps at the 60pt the desktop design wants, but scales down rather
           than pushing a horizontal scrollbar on a phone. */
        font-size: clamp(2.25rem, 11vw, 60pt);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        opacity: 0.75;
      }

      .footer-signoff {
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        opacity: 0.45;
      }

      .memorial {
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        opacity: 0.45;
      }

      /* ---- Alarm panel ---- */

      .alarm-dialog {
        width: min(94vw, 29rem);
        padding: 2.25rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.75rem;
        background: #fff;
        color: #111;
        font-family: inherit;
      }

      .alarm-dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }

      .alarm-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.75rem;
      }

      .alarm-head h2 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .alarm-close {
        padding: 0 0.25rem;
        border: 0;
        background: none;
        color: inherit;
        font-size: 1.75rem;
        line-height: 1;
        opacity: 0.5;
        cursor: pointer;
      }

      .alarm-close:hover {
        opacity: 1;
      }

      .alarm-modes {
        display: flex;
        margin-bottom: 1.75rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.5rem;
        overflow: hidden;
      }

      .alarm-modes button {
        flex: 1;
        padding: 0.75rem;
        border: 0;
        background: none;
        color: inherit;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .alarm-modes button[aria-selected="true"] {
        background: #111;
        color: #fff;
      }

      .alarm-fields[hidden] {
        display: none;
      }

      .alarm-row {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
      }

      .alarm-row label {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.45rem;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      .alarm-dialog input {
        width: 100%;
        padding: 0.7rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.5rem;
        background: #fff;
        color: inherit;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 1.375rem;
        text-align: center;
      }

      .alarm-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .alarm-presets button {
        padding: 0.45rem 0.85rem;
        border: 1px solid #d8d8d8;
        border-radius: 999px;
        background: none;
        color: inherit;
        font-family: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }

      .alarm-presets button:hover {
        border-color: #111;
      }

      .alarm-readout {
        margin: 1.75rem 0 1.5rem;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 2.75rem;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .alarm-readout small {
        display: block;
        margin-top: 0.5rem;
        font-family: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.55;
      }

      .alarm-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      .alarm-actions button {
        padding: 0.9rem;
        border: 1px solid #111;
        border-radius: 0.5rem;
        background: none;
        color: inherit;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .alarm-actions button.primary {
        background: #111;
        color: #fff;
      }

      .alarm-actions button:disabled {
        opacity: 0.3;
        cursor: default;
      }

      .alarm-sound {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      .alarm-sound input {
        width: 1.1rem;
        height: 1.1rem;
        margin: 0;
      }

      /* ---- Ringing ---- */

      .alarm-ring {
        position: fixed;
        z-index: 99;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 2rem;
        align-items: center;
        justify-content: center;
        /* ~1.4 Hz - deliberately under the 3 Hz photosensitivity threshold. */
        animation: alarm-flash 0.7s steps(1, end) infinite;
      }

      .alarm-ring[hidden] {
        display: none;
      }

      @keyframes alarm-flash {
        0%, 49.99% { background: #fff; }
        50%, 100% { background: #ffd400; }
      }

      .alarm-ring img {
        width: min(55vw, 24rem);
        height: auto;
        animation: alarm-pulse 0.7s ease-in-out infinite alternate;
      }

      @keyframes alarm-pulse {
        from { transform: scale(0.94); }
        to { transform: scale(1.06); }
      }

      .alarm-off {
        padding: 0.85rem 2.5rem;
        border: 2px solid #111;
        border-radius: 0.375rem;
        background: #111;
        color: #fff;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
      }

      @media (prefers-reduced-motion: reduce) {
        .alarm-ring,
        .alarm-ring img {
          animation: none;
        }

        .alarm-ring {
          background: #ffd400;
        }
      }

      /* Night palette, swapped with the logo at sunset and back at sunrise. */
      [data-daylight="night"] body {
        background: #000;
      }

      [data-daylight="night"] .footer-nav a,
      [data-daylight="night"] .footer-nav a:hover,
      [data-daylight="night"] .footer-nav .nav-action,
      [data-daylight="night"] .footer-stack {
        color: #fff;
      }

      [data-daylight="night"] .alarm-dialog {
        border-color: #333;
        background: #111;
        color: #fff;
      }

      [data-daylight="night"] .alarm-dialog input,
      [data-daylight="night"] .alarm-modes,
      [data-daylight="night"] .alarm-presets button {
        border-color: #333;
      }

      [data-daylight="night"] .alarm-dialog input {
        background: #000;
      }

      [data-daylight="night"] .alarm-modes button[aria-selected="true"] {
        background: #fff;
        color: #111;
      }

      [data-daylight="night"] .alarm-presets button:hover {
        border-color: #fff;
      }

      [data-daylight="night"] .alarm-actions button {
        border-color: #fff;
      }

      [data-daylight="night"] .alarm-actions button.primary {
        background: #fff;
        color: #111;
      }

      /* Landscape phones: the viewport is wide enough for the desktop layout
         but far too short for a full-size logo. */
      @media (min-width: 721px) and (max-height: 640px) {
        .logo-frame { width: min(70vw, 32rem, 28svh); }
      }

      /* Phones: the right-hand rail would sit on top of the logo, so the nav
         becomes a centred wrapped row and everything returns to normal flow. */
      @media (max-width: 720px) {
        body {
          padding: 1.5rem 1.25rem;
        }

        main {
          min-height: auto;
          padding: 0.5rem 0 1.75rem;
        }

        .logo-frame {
          width: min(72vw, 20rem);
        }

        .site-footer {
          position: static;
          right: auto;
          text-align: center;
        }

        .footer-nav {
          position: static;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          justify-content: center;
          gap: 0.6rem 1.1rem;
          transform: none;
        }

        .footer-nav a,
        .footer-nav .nav-action {
          font-size: 0.8125rem;
        }

        .footer-stack {
          position: static;
          max-width: none;
          margin-top: 2rem;
          padding: 0;
          transform: none;
        }
      }

      /* Narrow phones: keep the alarm card off the screen edges. */
      @media (max-width: 420px) {
        .alarm-dialog {
          padding: 1.5rem 1.25rem;
        }

        .alarm-readout {
          font-size: 2.25rem;
        }

        .alarm-dialog input {
          padding: 0.55rem;
          font-size: 1.125rem;
        }

        .alarm-row {
          gap: 0.4rem;
        }

        .alarm-actions button {
          padding: 0.75rem 0.4rem;
          font-size: 0.875rem;
        }
      }
    </style>
  </head>

    <main>
      <div class="logo-frame">

        <img class="logo" src="HandlerPath_Gators.webp" width="1254" height="1254" alt="Handler Path logo">
      </noscript>
      <script>
        (function () {
          // Sunset -> sunrise keeps the original logo; daylight shows Handler Path.
          var NIGHT = { src: "gitlabrador.webp", w: 784, h: 1168, alt: "Dog logo" };
          var DAY = { src: "HandlerPath_Gators.webp", w: 1254, h: 1254, alt: "Handler Path logo" };

          // Viewer's coordinates, inferred from their time zone. Set both to fixed
          // numbers instead to pin the whole site to one location's sun.
          var LAT = null;
          var LON = null;

          // Rough latitude per time zone: exact hits first, then continent.
          var ZONE_LAT = {
            "America/Sao_Paulo": -23.5, "America/Argentina": -34.6, "America/Santiago": -33.5,
            "America/Montevideo": -34.9, "America/Asuncion": -25.3, "America/La_Paz": -16.5,
            "America/Lima": -12, "America/Bogota": 4.6, "America/Anchorage": 61.2
          };
          var REGION_LAT = {
            America: 38, Europe: 50, Asia: 30, Africa: 5, Australia: -30,
            Pacific: -20, Atlantic: 30, Indian: -15, Antarctica: -70
          };

          function latitude() {
            if (LAT !== null) return LAT;
            var tz = "";
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
            for (var zone in ZONE_LAT) {
              if (tz.indexOf(zone) === 0) return ZONE_LAT[zone];
            }
            return REGION_LAT[tz.split("/")[0]] || 40;
          }

          function longitude() {
            if (LON !== null) return LON;
            // Standard-time offset (DST excluded) is the better longitude proxy.
            var y = new Date().getFullYear();
            var std = Math.max(
              new Date(y, 0, 1).getTimezoneOffset(),
              new Date(y, 6, 1).getTimezoneOffset()
            );
            return -std / 4; // minutes east of UTC -> degrees
          }

          // Sun's altitude in degrees (NOAA/SunCalc low-precision formulas).
          function altitude(date, lat, lon) {
            var rad = Math.PI / 180;
            var d = date.getTime() / 86400000 - 10957.5;      // days since J2000.0
            var M = rad * (357.5291 + 0.98560028 * d);        // mean anomaly
            var C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
            var L = M + C + rad * 102.9372 + Math.PI;         // ecliptic longitude
            var e = rad * 23.4397;                            // obliquity
            var dec = Math.asin(Math.sin(e) * Math.sin(L));
            var ra = Math.atan2(Math.sin(L) * Math.cos(e), Math.cos(L));
            var H = rad * (280.16 + 360.9856235 * d + lon) - ra;
            var p = rad * lat;
            return Math.asin(Math.sin(p) * Math.sin(dec) + Math.cos(p) * Math.cos(dec) * Math.cos(H)) / rad;
          }

          var img = document.getElementById("logo");
          var showing = null;

          function paint() {
            // -0.833 deg puts the sun's upper limb on the horizon, refraction included.
            var daylight = altitude(new Date(), latitude(), longitude()) > -0.833;
            var next = daylight ? DAY : NIGHT;
            if (next === showing) return;
            showing = next;
            img.width = next.w;
            img.height = next.h;
            img.alt = next.alt;
            img.src = next.src;
            document.documentElement.setAttribute("data-daylight", daylight ? "day" : "night");
          }

          paint();
          setInterval(paint, 60000);
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) paint();
          });
        })();
      </script>

      <script>
        (function () {
          // Hours and minutes only, in the viewer's own locale and time zone,
          // so the readout matches whatever their system clock shows.
          var el = document.getElementById("clock");
          var timer = null;

          function tick() {
            var now = new Date();
            el.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            // Re-arm on the next minute boundary rather than a fixed interval,
            // so the flip stays in step after sleep or clock changes.
            clearTimeout(timer);
            timer = setTimeout(tick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()));
          }

          tick();
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) tick();
          });
        })();
      </script>

    <script>
      (function () {
        // Timer and wall-clock alarm sharing one state machine:
        //   idle -> running -> ringing, with paused hanging off running.
        // Deadlines are absolute timestamps, never accumulated intervals, so a
        // throttled background tab or a sleeping laptop can't drift the count.
        var KEY = "handlerpath.alarm";
        var RING_MAX_MS = 300000;   // stop flashing after 5 min if nobody's home
        var CATCHUP_MS = 300000;    // a deadline missed while away still rings if recent

        var $ = function (id) { return document.getElementById(id); };
        var dlg = $("alarm-dialog");
        var statusEl = $("alarm-status");
        var big = $("alarm-big");
        var sub = $("alarm-sub");
        var ring = $("alarm-ring");
        var ringLogo = $("alarm-ring-logo");
        var soundBox = $("alarm-sound");
        var fields = { timer: $("fields-timer"), alarm: $("fields-alarm") };
        var tabs = { timer: $("mode-timer"), alarm: $("mode-alarm") };
        var btn = { set: $("btn-set"), stop: $("btn-stop"), reset: $("btn-reset"), off: $("btn-off") };

        var st = {
          mode: "timer",
          state: "idle",
          durationMs: 300000,  // what Reset returns the timer to
          remainingMs: 300000, // banked time while paused or idle
          deadline: 0,         // epoch ms the timer/alarm fires
          alarmTime: "",       // "HH:MM" for alarm mode
          sound: true
        };

        var ticker = null;
        var beeper = null;
        var ringStarted = 0;
        var ac = null;

        /* ---- persistence ------------------------------------------------ */

        function save() {
          try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
        }

        function load() {
          var raw = null;
          try { raw = localStorage.getItem(KEY); } catch (e) {}
          if (!raw) return;
          try {
            var v = JSON.parse(raw);
            for (var k in st) if (v.hasOwnProperty(k)) st[k] = v[k];
          } catch (e) { return; }
          if (st.state === "ringing") st.state = "idle";
          if (st.state === "running") {
            var late = Date.now() - st.deadline;
            // Fire only if it just came due; anything staler is silently dropped
            // so a tab reopened next week doesn't scream at you.
            if (late >= 0) { st.state = late < CATCHUP_MS ? "fire" : "idle"; }
          }
        }

        /* ---- formatting ------------------------------------------------- */

        function pad(n) { return n < 10 ? "0" + n : "" + n; }

        function fmtLeft(ms) {
          var t = Math.max(0, Math.ceil(ms / 1000));
          var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
          return h ? h + ":" + pad(m) + ":" + pad(sec) : m + ":" + pad(sec);
        }

        function fmtClock(ts) {
          return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }

        /* ---- audio ------------------------------------------------------ */

        // Built lazily inside a click so autoplay policy lets it through.
        function audio() {
          if (!ac) {
            var C = window.AudioContext || window.webkitAudioContext;
            if (!C) return null;
            try { ac = new C(); } catch (e) { return null; }
          }
          if (ac.state === "suspended") ac.resume();
          return ac;
        }

        function beep() {
          if (!st.sound) return;
          var c = audio();
          if (!c) return;
          for (var i = 0; i < 3; i++) {
            var at = c.currentTime + i * 0.22;
            var o = c.createOscillator(), g = c.createGain();
            o.type = "square";
            o.frequency.value = 880;
            g.gain.setValueAtTime(0.0001, at);
            g.gain.exponentialRampToValueAtTime(0.22, at + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
            o.connect(g);
            g.connect(c.destination);
            o.start(at);
            o.stop(at + 0.2);
          }
        }

        /* ---- inputs ----------------------------------------------------- */

        function readFields() {
          if (st.mode === "timer") {
            var h = +$("t-h").value || 0, m = +$("t-m").value || 0, sec = +$("t-s").value || 0;
            return (h * 3600 + m * 60 + sec) * 1000;
          }
          var parts = ($("a-time").value || "").split(":");
          if (parts.length < 2) return 0;
          var target = new Date();
          target.setHours(+parts[0], +parts[1], 0, 0);
          // A time already past today means tomorrow.
          if (target.getTime() <= Date.now()) target.setDate(target.getDate() + 1);
          return target.getTime() - Date.now();
        }

        function writeTimerFields(ms) {
          var t = Math.round(ms / 1000);
          $("t-h").value = Math.floor(t / 3600);
          $("t-m").value = Math.floor((t % 3600) / 60);
          $("t-s").value = t % 60;
        }

        /* ---- render ----------------------------------------------------- */

        function left() {
          if (st.state === "running") return st.deadline - Date.now();
          return st.remainingMs;
        }

        function render() {
          tabs.timer.setAttribute("aria-selected", st.mode === "timer");
          tabs.alarm.setAttribute("aria-selected", st.mode === "alarm");
          fields.timer.hidden = st.mode !== "timer";
          fields.alarm.hidden = st.mode !== "alarm";

          var main = "\u2014", note = "Not set", badge = "";

          if (st.state === "running") {
            main = st.mode === "timer" ? fmtLeft(left()) : fmtClock(st.deadline);
            note = st.mode === "timer" ? "Counting down" : "Rings in " + fmtLeft(left());
            badge = (st.mode === "timer" ? "TIMER " : "ALARM ") + main;
          } else if (st.state === "paused") {
            main = fmtLeft(st.remainingMs);
            note = "Stopped";
            badge = "TIMER " + main + " STOPPED";
          } else if (st.state === "ringing") {
            main = "RINGING";
            note = "Turn it off";
            badge = "ALARM RINGING";
          }

          big.textContent = main;
          sub.textContent = note;

          statusEl.hidden = !badge;
          statusEl.textContent = badge;

          btn.set.disabled = st.state === "running" || st.state === "ringing";
          btn.set.textContent = st.state === "paused" ? "Resume" : "Set";
          btn.stop.disabled = st.state !== "running";
          btn.reset.disabled = st.state === "idle" && st.remainingMs === st.durationMs;
          btn.off.disabled = st.state !== "ringing";
        }

        /* ---- state machine ---------------------------------------------- */

        function startTicking() {
          stopTicking();
          ticker = setInterval(function () {
            if (st.state !== "running") return;
            if (Date.now() >= st.deadline) fire();
            else render();
          }, 250);
        }

        function stopTicking() {
          if (ticker) { clearInterval(ticker); ticker = null; }
        }

        function set() {
          var ms;
          if (st.state === "paused") {
            ms = st.remainingMs;                 // Resume from where Stop left it
          } else {
            ms = readFields();
            if (ms <= 0) { sub.textContent = "Enter a time first"; return; }
            if (st.mode === "timer") st.durationMs = ms;
            else st.alarmTime = $("a-time").value;
          }
          st.remainingMs = ms;
          st.deadline = Date.now() + ms;
          st.state = "running";
          audio();                                // unlock inside this click
          save();
          startTicking();
          render();
          dlg.close();   // armed - get the card out of the way
        }

        function stop() {
          if (st.state !== "running") return;
          st.remainingMs = Math.max(0, st.deadline - Date.now());
          // A wall-clock alarm has nothing to resume into, so Stop disarms it.
          st.state = st.mode === "timer" ? "paused" : "idle";
          if (st.state === "idle") st.remainingMs = st.durationMs;
          st.deadline = 0;
          stopTicking();
          save();
          render();
        }

        function reset() {
          silence();
          stopTicking();
          st.state = "idle";
          st.deadline = 0;
          st.remainingMs = st.durationMs;
          if (st.mode === "timer") writeTimerFields(st.durationMs);
          save();
          render();
        }

        function fire() {
          stopTicking();
          st.state = "ringing";
          st.remainingMs = 0;
          st.deadline = 0;
          save();

          var live = document.getElementById("logo");
          ringLogo.src = (live && live.src) || "HandlerPath_Gators.webp";
          ringLogo.alt = "Alarm";
          if (dlg.open) dlg.close();
          ring.hidden = false;
          ringStarted = Date.now();
          beep();
          beeper = setInterval(function () {
            if (Date.now() - ringStarted > RING_MAX_MS) { turnOff(); return; }
            beep();
          }, 1500);
          render();
        }

        function silence() {
          if (beeper) { clearInterval(beeper); beeper = null; }
          ring.hidden = true;
        }

        function turnOff() {
          silence();
          st.state = "idle";
          st.remainingMs = st.durationMs;
          st.deadline = 0;
          save();
          render();
        }

        /* ---- wiring ----------------------------------------------------- */

        $("alarm-link").addEventListener("click", function () {
          render();
          dlg.showModal();
        });
        $("alarm-close").addEventListener("click", function () { dlg.close(); });

        Object.keys(tabs).forEach(function (m) {
          tabs[m].addEventListener("click", function () {
            if (st.state === "running" || st.state === "ringing") return;
            st.mode = m;
            reset();
          });
        });

        Array.prototype.forEach.call(
          document.querySelectorAll(".alarm-presets button"),
          function (b) {
            b.addEventListener("click", function () {
              writeTimerFields(+b.dataset.secs * 1000);
              st.durationMs = st.remainingMs = +b.dataset.secs * 1000;
              st.state = "idle";
              save();
              render();
            });
          }
        );

        btn.set.addEventListener("click", set);
        btn.stop.addEventListener("click", stop);
        btn.reset.addEventListener("click", reset);
        btn.off.addEventListener("click", turnOff);
        $("alarm-off").addEventListener("click", turnOff);

        $("a-time").addEventListener("change", function () {
          st.alarmTime = $("a-time").value;
          save();
        });

        soundBox.addEventListener("change", function () {
          st.sound = soundBox.checked;
          save();
        });

        // Esc kills the flash as well as the dialog.
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && st.state === "ringing") turnOff();
        });

        // Coming back to a throttled tab: settle up immediately.
        document.addEventListener("visibilitychange", function () {
          if (document.hidden || st.state !== "running") return;
          if (Date.now() >= st.deadline) fire();
          else render();
        });

        load();
        soundBox.checked = st.sound;
        if (st.mode === "alarm") $("a-time").value = st.alarmTime;
        writeTimerFields(st.mode === "timer" ? (st.remainingMs || st.durationMs) : st.durationMs);
        if (st.state === "fire") { st.state = "running"; fire(); }
        else if (st.state === "running") startTicking();
        save();   // write back whatever load() normalised, so stale records don't linger
        render();
      })();
    </script>
  </body>
</html>
