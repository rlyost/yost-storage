<html lang="en">
  <head>
    <meta charset="utf-8">

  While you're here: the logo swaps itself at sunrise and sunset. No API call,

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon-64.png" sizes="64x64">
    <script src="assets/js/daylight-selection.js"></script>
    <title>The Pack</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        position: relative;
        min-height: 100svh;
        padding: 2rem;
        background: #f3f3f3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        place-items: center;
        gap: clamp(1rem, 3vh, 2rem);
        min-height: calc(100svh - 4rem);
        padding-bottom: clamp(8rem, 24vh, 12rem);
      }

      .logo-frame {
        position: relative;
        width: min(70vw, 32rem);
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
      }

      /* ---- Calculator ---- */

      .calculator {
        position: fixed;
        z-index: 10;
        top: 50%;
        right: calc(50% + min(35vw, 16rem) + 1.5rem);
        left: auto;
        width: min(18rem, calc(100vw - 2rem));
        padding: 1rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.75rem;
        background: #fff;
        color: #111;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.18);
        margin: 0;
        transform: translateY(-50%);
      }

      .calculator:not([open]) {
        display: none;
      }

      .calc-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.75rem;
      }

      .calc-head h2 {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .calc-close {
        padding: 0 0.2rem;
        border: 0;
        background: none;
        color: inherit;
        font-size: 1.35rem;
        line-height: 1;
        opacity: 0.55;
        cursor: pointer;
      }

      .calc-close:hover { opacity: 1; }

      .calc-display {
        display: block;
        width: 100%;
        min-height: 4.25rem;
        margin-bottom: 0.75rem;
        padding: 0.8rem;
        overflow: hidden;
        border: 1px solid #d8d8d8;
        border-radius: 0.5rem;
        background: #f5f5f5;
        font: 600 1.75rem/1.4 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-variant-numeric: tabular-nums;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .calc-keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.45rem;
      }

      .calc-keys button {
        min-height: 2.8rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.45rem;
        background: #f5f5f5;
        color: inherit;
        font: 650 1rem/1 inherit;
        cursor: pointer;
      }

      .calc-keys button:hover { border-color: #111; }
      .calc-keys button:active { transform: translateY(1px); }
      .calc-keys .operator { background: #e8e8e8; }
      .calc-keys .equals { background: #111; color: #fff; }
      .calc-keys .span-two { grid-column: span 2; }

      /* Night: the mark is a black disc, so ring it to lift it off the page.
         Percentages match the disc inside gitlabrador.webp (bbox 24,234-757,959
         of 784x1168), so the ring tracks the logo at any size. */
      [data-daylight="night"] .logo-frame::after {
        content: "";
        position: absolute;
        top: 51.1%;
        left: 49.8%;
        width: 99%;
        aspect-ratio: 1;
        border: 2px solid #fff;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .site-footer {
        position: absolute;
        top: 0;
        right: 1.5rem;
        bottom: 1rem;
        text-align: right;
      }

      .footer-nav {
        position: absolute;
        top: 50%;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.75rem;
        transform: translateY(-50%);
      }

      .footer-nav a,
      .footer-nav .nav-action {
        color: #555;
        font-size: 0.75rem;
        font-weight: 600;
        text-decoration: none;
      }

      /* Set Alarm acts on this page rather than navigating, so it is a button
         wearing the nav links' clothes. */
      .footer-nav .nav-action {
        padding: 0;
        border: 0;
        background: none;
        font-family: inherit;
        line-height: inherit;
        cursor: pointer;
      }

      .footer-nav a:hover,
      .footer-nav .nav-action:hover {
        color: #000;
        text-decoration: underline;
        text-underline-offset: 0.2rem;
      }

      /* One centred stack at the foot of the page. Grouping these lets the
         clock resize without four hand-tuned offsets drifting out of step. */
      .footer-stack {
        position: fixed;
        z-index: 1;
        bottom: 1rem;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        max-width: 100vw;
        padding: 0 1rem;
        color: #111;
        text-align: center;
        transform: translateX(-50%);
      }

      /* Sits above the logo so an armed alarm is the first thing read on the
         page, without opening the panel. Hidden entirely while idle, which
         also drops its grid row so the logo stays centred. */
      .alarm-status {
        /* Scales with the viewport like the clock, capped just under the
           clock's size so it reads as a headline without crowding the logo. */
        font-size: clamp(1.75rem, 7vw, 3rem);
        font-weight: 600;
        letter-spacing: 0.1em;
        color: #111;
        text-align: center;
        opacity: 0.7;
      }

      .clock {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        /* Caps at the 60pt the desktop design wants, but scales down rather
           than pushing a horizontal scrollbar on a phone. */
        font-size: clamp(2.25rem, 11vw, 60pt);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        opacity: 0.75;
      }

      .footer-signoff {
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        opacity: 0.45;
      }

      .memorial {
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        opacity: 0.45;
      }

      /* ---- Alarm panel ---- */

      .alarm-dialog {
        width: min(94vw, 29rem);
        padding: 2.25rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.75rem;
        background: #fff;
        color: #111;
        font-family: inherit;
      }

      .alarm-dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }

      .alarm-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.75rem;
      }

      .alarm-head h2 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .alarm-close {
        padding: 0 0.25rem;
        border: 0;
        background: none;
        color: inherit;
        font-size: 1.75rem;
        line-height: 1;
        opacity: 0.5;
        cursor: pointer;
      }

      .alarm-close:hover {
        opacity: 1;
      }

      .alarm-modes {
        display: flex;
        margin-bottom: 1.75rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.5rem;
        overflow: hidden;
      }

      .alarm-modes button {
        flex: 1;
        padding: 0.75rem;
        border: 0;
        background: none;
        color: inherit;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .alarm-modes button[aria-selected="true"] {
        background: #111;
        color: #fff;
      }

      .alarm-fields[hidden] {
        display: none;
      }

      .alarm-row {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
      }

      .alarm-row label {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 0.45rem;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      .alarm-dialog input {
        width: 100%;
        padding: 0.7rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.5rem;
        background: #fff;
        color: inherit;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 1.375rem;
        text-align: center;
      }

      .alarm-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .alarm-presets button {
        padding: 0.45rem 0.85rem;
        border: 1px solid #d8d8d8;
        border-radius: 999px;
        background: none;
        color: inherit;
        font-family: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }

      .alarm-presets button:hover {
        border-color: #111;
      }

      .alarm-readout {
        margin: 1.75rem 0 1.5rem;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        font-size: 2.75rem;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .alarm-readout small {
        display: block;
        margin-top: 0.5rem;
        font-family: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.55;
      }

      .alarm-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      .alarm-actions button {
        padding: 0.9rem;
        border: 1px solid #111;
        border-radius: 0.5rem;
        background: none;
        color: inherit;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .alarm-actions button.primary {
        background: #111;
        color: #fff;
      }

      .alarm-actions button:disabled {
        opacity: 0.3;
        cursor: default;
      }

      .alarm-sound {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      .alarm-sound input {
        width: 1.1rem;
        height: 1.1rem;
        margin: 0;
      }

      /* ---- Ringing ---- */

      .alarm-ring {
        position: fixed;
        z-index: 99;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 2rem;
        align-items: center;
        justify-content: center;
        /* ~1.4 Hz - deliberately under the 3 Hz photosensitivity threshold. */
        animation: alarm-flash 0.7s steps(1, end) infinite;
      }

      .alarm-ring[hidden] {
        display: none;
      }

      @keyframes alarm-flash {
        0%, 49.99% { background: #fff; }
        50%, 100% { background: #ffd400; }
      }

      .alarm-ring img {
        width: min(55vw, 24rem);
        height: auto;
        animation: alarm-pulse 0.7s ease-in-out infinite alternate;
      }

      @keyframes alarm-pulse {
        from { transform: scale(0.94); }
        to { transform: scale(1.06); }
      }

      .alarm-off {
        padding: 0.85rem 2.5rem;
        border: 2px solid #111;
        border-radius: 0.375rem;
        background: #111;
        color: #fff;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
      }

      @media (prefers-reduced-motion: reduce) {
        .alarm-ring,
        .alarm-ring img {
          animation: none;
        }

        .alarm-ring {
          background: #ffd400;
        }
      }

      /* Night palette, swapped with the logo at sunset and back at sunrise. */
      [data-daylight="night"] body {
        background: #000;
      }

      [data-daylight="night"] .footer-nav a,
      [data-daylight="night"] .footer-nav a:hover,
      [data-daylight="night"] .footer-nav .nav-action,
      [data-daylight="night"] .alarm-status,
      [data-daylight="night"] .footer-stack {
        color: #fff;
      }

      [data-daylight="night"] .alarm-dialog {
        border-color: #333;
        background: #111;
        color: #fff;
      }

      [data-daylight="night"] .calculator {
        border-color: #333;
        background: #111;
        color: #fff;
      }

      [data-daylight="night"] .calc-display,
      [data-daylight="night"] .calc-keys button {
        border-color: #3b3b3b;
        background: #202020;
      }

      [data-daylight="night"] .calc-keys .operator { background: #303030; }
      [data-daylight="night"] .calc-keys .equals { background: #fff; color: #111; }
      [data-daylight="night"] .calc-keys button:hover { border-color: #fff; }

      [data-daylight="night"] .alarm-dialog input,
      [data-daylight="night"] .alarm-modes,
      [data-daylight="night"] .alarm-presets button {
        border-color: #333;
      }

      [data-daylight="night"] .alarm-dialog input {
        background: #000;
      }

      [data-daylight="night"] .alarm-modes button[aria-selected="true"] {
        background: #fff;
        color: #111;
      }

      [data-daylight="night"] .alarm-presets button:hover {
        border-color: #fff;
      }

      [data-daylight="night"] .alarm-actions button {
        border-color: #fff;
      }

      [data-daylight="night"] .alarm-actions button.primary {
        background: #fff;
        color: #111;
      }

      /* Landscape phones: the viewport is wide enough for the desktop layout
         but far too short for a full-size logo. */
      @media (min-width: 721px) and (max-height: 640px) {
        .logo-frame { width: min(70vw, 32rem, 28svh); }
      }

      /* Phones: the right-hand rail would sit on top of the logo, so the nav
         becomes a centred wrapped row and everything returns to normal flow. */
      @media (max-width: 720px) {
        body {
          padding: 1.5rem 1.25rem;
        }

        main {
          min-height: auto;
          padding: 0.5rem 0 1.75rem;
        }

        .logo-frame {
          width: min(72vw, 20rem);
        }

        .site-footer {
          position: static;
          right: auto;
          text-align: center;
        }

        .footer-nav {
          position: static;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          justify-content: center;
          gap: 0.6rem 1.1rem;
          transform: none;
        }

        .footer-nav a,
        .footer-nav .nav-action {
          font-size: 0.8125rem;
        }

        .footer-stack {
          position: static;
          max-width: none;
          margin-top: 2rem;
          padding: 0;
          transform: none;
        }

        .calculator {
          top: 50%;
          right: auto;
          left: 50%;
          transform: translate(-50%, -50%);
        }
      }

      /* Narrow phones: keep the alarm card off the screen edges. */
      @media (max-width: 420px) {
        .alarm-dialog {
          padding: 1.5rem 1.25rem;
        }

        .alarm-readout {
          font-size: 2.25rem;
        }

        .alarm-dialog input {
          padding: 0.55rem;
          font-size: 1.125rem;
        }

        .alarm-row {
          gap: 0.4rem;
        }

        .alarm-actions button {
          padding: 0.75rem 0.4rem;
          font-size: 0.875rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="alarm-status" id="alarm-status" hidden></div>
      <div class="logo-frame">
        <img class="logo" id="logo" sizes="min(70vw, 32rem)"
          fetchpriority="high" decoding="async" alt="">
      </div>
      <noscript>
        <img class="logo" src="HandlerPath_Gators-512.webp"
          srcset="HandlerPath_Gators-512.webp 512w, HandlerPath_Gators-1024.webp 1024w"
          sizes="min(70vw, 32rem)" width="1254" height="1254" alt="Handler Path logo">
      </noscript>
      <script src="assets/js/daylight.js"></script>
    </main>
    <footer class="site-footer">
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="PAWS_Training_Manual.html">PAWS Training Manual</a>
        <a href="https://www.yost.group/index.html">Yost Group</a>
        <a href="https://www.yost.group/apps/apps.html">Apps</a>
        <a href="https://www.yost.group/apps/titanlog/titanlog.html">TitanLog</a>
        <a href="https://www.yost.group/apps/yostnotes_app.html">YostNotes</a>
        <a href="https://www.yost.group/apps/gateway_app.html">The Gateway</a>
        <a href="https://app.citadel-map.com">Citadel Money</a>
        <a href="https://github.com/rlyost">GitHub</a>
        <a href="zsh_terminal_colorization_guide.html">Zsh Color Guide</a>
        <a href="claude-engineering-prompts.html">Claude Engineering Prompts</a>
        <a href="multi_platform_deployment_guide.html">Multi-Platform Deployment Guide</a>
        <button type="button" class="nav-action" id="alarm-link" aria-haspopup="dialog">Set Alarm</button>
        <button type="button" class="nav-action" id="calc-link" aria-expanded="false" aria-controls="calculator">Calc</button>
      </nav>
      <div class="footer-stack">
        <div class="clock" id="clock" role="timer" aria-live="off"></div>
        <div class="footer-signoff">RLTW!</div>
        <div class="memorial">In Memoriam: Regnar, Sabot, BoBo.</div>
      </div>
      <script src="assets/js/time.js"></script>
      <script src="assets/js/clock.js"></script>
    </footer>

    <dialog class="calculator" id="calculator" aria-labelledby="calc-title">
      <div class="calc-head">
        <h2 id="calc-title">Calculator</h2>
        <button type="button" class="calc-close" id="calc-close" aria-label="Close calculator">&times;</button>
      </div>
      <output class="calc-display" id="calc-display" aria-live="polite">0</output>
      <div class="calc-keys" id="calc-keys">
        <button type="button" data-action="clear">AC</button>
        <button type="button" data-action="sign">+/−</button>
        <button type="button" data-action="percent">%</button>
        <button type="button" class="operator" data-operation="/" aria-label="Divide">÷</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="operator" data-operation="*" aria-label="Multiply">×</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" class="operator" data-operation="-" aria-label="Subtract">−</button>
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" class="operator" data-operation="+" aria-label="Add">+</button>
        <button type="button" class="span-two" data-digit="0">0</button>
        <button type="button" data-action="decimal">.</button>
        <button type="button" class="equals" data-action="equals">=</button>
      </div>
    </dialog>

    <script src="assets/js/calculator.js"></script>

    <dialog class="alarm-dialog" id="alarm-dialog" aria-labelledby="alarm-title">
      <div class="alarm-head">
        <h2 id="alarm-title">Set Alarm</h2>
        <button type="button" class="alarm-close" id="alarm-close" aria-label="Close">&times;</button>
      </div>

      <div class="alarm-modes" role="tablist">
        <button type="button" role="tab" id="mode-timer" data-mode="timer" aria-selected="true">Timer</button>
        <button type="button" role="tab" id="mode-alarm" data-mode="alarm" aria-selected="false">Alarm</button>
      </div>

      <div class="alarm-fields" id="fields-timer">
        <div class="alarm-row">
          <label>Hrs <input type="number" id="t-h" min="0" max="99" step="1" value="0"></label>
          <label>Min <input type="number" id="t-m" min="0" max="59" step="1" value="5"></label>
          <label>Sec <input type="number" id="t-s" min="0" max="59" step="1" value="0"></label>
        </div>
        <div class="alarm-presets">
          <button type="button" data-secs="60">1 min</button>
          <button type="button" data-secs="300">5 min</button>
          <button type="button" data-secs="600">10 min</button>
          <button type="button" data-secs="1500">25 min</button>
          <button type="button" data-secs="1800">30 min</button>
          <button type="button" data-secs="3600">1 hr</button>
        </div>
      </div>

      <div class="alarm-fields" id="fields-alarm" hidden>
        <div class="alarm-row">
          <label>Ring at <input type="time" id="a-time"></label>
        </div>
      </div>

      <div class="alarm-readout" aria-live="polite">
        <span id="alarm-big">&mdash;</span><small id="alarm-sub">Not set</small>
      </div>

      <div class="alarm-actions">
        <button type="button" class="primary" id="btn-set">Set</button>
        <button type="button" id="btn-stop">Stop</button>
        <button type="button" id="btn-reset">Reset</button>
        <button type="button" id="btn-off">Turn Off</button>
      </div>

      <label class="alarm-sound">
        <input type="checkbox" id="alarm-sound" checked> Sound
      </label>
    </dialog>

    <div class="alarm-ring" id="alarm-ring" hidden role="alertdialog" aria-label="Alarm ringing">
      <img id="alarm-ring-logo" alt="">
      <button type="button" class="alarm-off" id="alarm-off">Turn Off</button>
    </div>

    <script src="assets/js/alarm-state.js"></script>
